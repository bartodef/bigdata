apiVersion: v1
kind: Pod
metadata:
  name: ceph-connector
  namespace: lab-configmap-secret
spec:
  containers:
  - name: ceph-app
    image: python:3.9
    command: ["python", "-c", "import os; print(f'Access Key: {os.environ[\"S3_ACCESS_KEY\"]}')"]
    env:
    # Single Secret key as env var
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ceph-s3-credentials
          key: access-key

    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ceph-s3-credentials
          key: secret-key

    - name: S3_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: ceph-s3-credentials
          key: endpoint

    # Inject all Secret keys as env vars
    envFrom:
    - secretRef:
        name: ceph-s3-credentials
