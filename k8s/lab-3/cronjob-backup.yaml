apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-backup
  namespace: lab-job-cronjob
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: python:3.9
            command: ["python", "-c", "print('Backup completed')"]
          restartPolicy: Never
